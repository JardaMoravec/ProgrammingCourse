    hodiny: 70
    # ŠVP 51 h → 70 h. Posíleno místo Tkinteru; 10 h vráceno do algoritmizace (ŠVP 21 h).
    svp_temata:
      - principy relační databáze
      - koncepce jazyka SQL
      - definování databázových objektů
      - načítaní dat pomocí jazyka DQL (SELECT)
      - kombinování dat z více tabulek
      - tvorba složitějších dotazů
      - správa dat pomocí jazyka DML (UPDATE, INSERT, DELETE)
      - zabezpečení pomocí jazyka DCL
      - zajištění integrity databáze pomocí transakcí
      - integrace jazyka SQL do aplikací
      - problematika výkonu a ladění SQL
