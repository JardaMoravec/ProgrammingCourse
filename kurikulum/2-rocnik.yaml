# Kurikulum 2. ročník — podle ŠVP
# Přepsáno z: zdroje/_Osnovy 2 roč.docx
# Učitelský text: zdroje/Programování 2.docx, zdroje/Programování 2 – Python manuál.docx
# Úkoly: zdroje/Úkoly 2/ (30 zadání) — mapování u jednotlivých lekcí
# Jazyk: Python (ŠVP u OOP používá slovník z C# — struktury, řádkové metody, mnohotvárnost)
# SQL: SQLite (původní Úkoly 2 počítají s MySQL; sjednoceno s 3. ročníkem)
# Tkinter / GUI se neučí — kompetence „framework“ se naplní ve 3. ročníku (Flask)
# Algoritmizace SŠ základ (ŠVP 21 h → 20 h, dvě lekce po 10 h). SQL posílené místo Tkinteru.
# Znalostní báze = MD/YAML v lekce/, ne původní DOCX

rocnik: 2
predmet: Programování (PRG)
obor: Informační technologie – Cloud (I+Im-It)
kod_oboru: 18-20-M/01
jazyk: Python
nazev: Objektové programování a SQL

hodiny:
  tydne: 5
  cvičeni: 5
  celkem: 170
  tydnu: 34

predchozi_znalosti:
  - Strukturované programování v Pythonu (1. ročník)
  # ŠVP uvádí „Strukturované programování (102 h), C#“ — kurz je v Pythonu v 1.–3. ročníku

kompetence:
  - id: k1-datove-typy
    text: použije základní datové typy
  - id: k2-ridici-struktury
    text: použije řídící struktury programu
  - id: k3-strukturovane-programy
    text: vytvoří jednoduché strukturované programy
  - id: k4-trida-objekt
    text: rozumí pojmům třída, objekt a zná jejich základní vlastnosti
  - id: k5-jednoduche-objekty
    text: použije jednoduché objekty
  - id: k6-sql-zaklady
    text: zná výhody použití jazyka SQL; použije základní příkazy jazyka SQL
  - id: k7-databaze
    text: schopen navrhovat, spravovat a aktualizovat relační databáze
  - id: k8-db-bezpecnost
    text: rozumí zabezpečení databáze proti vnitřním a vnějším útokům
  - id: k9-aplikace
    text: vytvoří jednoúčelové aplikace dle zadání; aplikuje objektový model ve svém kódu
  - id: k10-framework
    text: využívá třídy třetích stran (framework)
    # Ve 2. ročníku se neučí (bez Tkinteru). Naplní se ve 3. ročníku — Flask.

moduly:
