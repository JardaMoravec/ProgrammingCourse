literatura:
  - elektronické texty v rámci školních informačních a vzdělávacích systémů
  - dokumentace Python (https://docs.python.org/3/)
  - dokumentace sqlite3 (https://docs.python.org/3/library/sqlite3.html)

pomucky:
  - základní počítačová sestava
  - dataprojektor
  - potřebné softwarové vybavení (Python 3, SQLite, IDE)

