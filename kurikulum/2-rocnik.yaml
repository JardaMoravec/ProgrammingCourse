            nazev: Rekurze — základ
            hodiny: 10
            svp: [rekurze, využití rekurze]
            kompetence: [k2-ridici-struktury, k3-strukturovane-programy]
            prerekvizity: []
            ukoly_zdroje:
              - "úkol 1 - rekurze"
              - "úkol 2 - rekurze"
              - "úkol 4a - rekurze - na známky"
              - "úkol 4b - rekurze - na známky"
              - "úkol 5 - rekurze - hledání extrému"

