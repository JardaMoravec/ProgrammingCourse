hodnoceni:
  - práce v hodině (cvičení)
  - u CSV/JSON/XML a ORM samostatné úkoly (Moodle VPL)

literatura:
  - dokumentace Git (https://git-scm.com/doc) — práce přes IDE
  - GitHub Docs (https://docs.github.com/)
  - dokumentace Docker (https://docs.docker.com/) — Desktop a IDE
  - dokumentace csv (https://docs.python.org/3/library/csv.html)
  - dokumentace json (https://docs.python.org/3/library/json.html)
  - dokumentace ElementTree (https://docs.python.org/3/library/xml.etree.elementtree.html)
  - GraphQL (https://graphql.org/learn/) — orientace, ne náhrada učebního textu
  - dokumentace Flask-SQLAlchemy (https://flask-sqlalchemy.readthedocs.io/)

pomucky:
  - základní počítačová sestava
  - dataprojektor
  - terminál v IDE (Windows: PowerShell; Linux: bash)
  - Git v IDE; volitelně účet GitHub a Docker Desktop
  - u ORM: Python 3, Flask, Flask-SQLAlchemy, IDE, webový prohlížeč
