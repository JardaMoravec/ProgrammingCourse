# Bonusové lekce — mimo hodinovou dotaci ročníků
# Volitelné; lze přeskočit. Nejsou v ŠVP hodinách 1.–3. ročníku.

skupina: bonus
predmet: Programování (PRG)
obor: Informační technologie – Cloud (I+Im-It)
kod_oboru: 18-20-M/01
jazyk: volitelné
nazev: Volitelné lekce

hodiny:
  celkem: 0

predchozi_znalosti:
  - Konzole: Python a prostředí (1. ročník, lekce 02)
  - Git a Docker: strukturované programování v Pythonu (1. ročník)
  - CSV, JSON a XML: soubory a slovníky (1. ročník)
  - API REST/GraphQL: HTTP z 3. ročníku (lekce 01)
  - ORM: Flask a sqlite3 (3. ročník, lekce 16–20)
  - Návrhové vzory: OOP návrh (2. ročník, lekce 11)

