            kompetence: [k3-strukturovane-programy]
            prerekvizity: [27-funkce-pokrocile]

          - id: "02-docker"
            soubor: lekce/bonus/02-docker
            nazev: Docker
            hodiny: 0
            svp: [vývojové prostředí]
            kompetence: [k3-strukturovane-programy]
            prerekvizity: [01-git-a-github]

