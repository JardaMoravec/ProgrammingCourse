  - soubor: zdroje/Programování 1 - Python manuál.docx
    typ: ucitelsky-text
  - soubor: zdroje/01 - Úvod do Pythonu.pptx
    lekce: [01-programovani-a-jazyky, 02-python-a-prostredi]
  - soubor: zdroje/02 - Proměnné, datové typy a operátory v Pythonu.pptx
    lekce: [04-promenne-a-pamet, 05-aritmeticke-operatory, 07-datove-typy, 08-porovnaci-operatory]
  - soubor: zdroje/03 - Seznamy, Tuples, Slovníky a range v Pythonu.pptx
