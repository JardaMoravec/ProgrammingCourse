# Kurikulum 1. ročník — podle ŠVP
# Přepsáno z: zdroje/_Osnovy 1 roč.docx (po ověření lze smazat)
# Znalostní báze = MD/YAML v lekce/, ne původní DOCX/PPTX

rocnik: 1
predmet: Programování (PRG)
obor: Informační technologie – Cloud (I+Im-It)
kod_oboru: 18-20-M/01
jazyk: Python

hodiny:
  tydne: 3
  cvičeni: 3
  celkem: 81
  tydnu: 27

predchozi_znalosti: []

kompetence:
  - id: k1-datove-typy
    text: použije základní datové typy
  - id: k2-ridici-struktury
    text: použije řídící struktury programu
  - id: k3-strukturovane-programy
    text: vytvoří jednoduché strukturované programy

moduly:
  - id: strukturovane-programovani
    nazev: Strukturované programování
    hodiny: 81
    svp_temata:
      - vývojové prostředí
      - anatomie programu
      - paměť a datové typy
      - proměnné
      - aritmetické, logické operátory
      - vnořené podmínky
      - cykly, funkce
      - znaky, řetězce
      - řídicí struktury
      - pole
      - IO operace (čtení a zápis dat do souboru)

    bloky:
      - id: uvod-a-prostredi
        nazev: Úvod do programování a prostředí
        hodiny: 9
        lekce:
          - id: "01-programovani-a-jazyky"
            soubor: lekce/1-rocnik/01-programovani-a-jazyky
            nazev: Programování a programovací jazyky
            hodiny: 3
            svp: [anatomie programu]
            kompetence: [k3-strukturovane-programy]
            prerekvizity: []

          - id: "02-python-a-prostredi"
            soubor: lekce/1-rocnik/02-python-a-prostredi
            nazev: Python, instalace a vývojové prostředí
            hodiny: 3
            svp: [vývojové prostředí]
            kompetence: [k3-strukturovane-programy]
            prerekvizity: [01-programovani-a-jazyky]

