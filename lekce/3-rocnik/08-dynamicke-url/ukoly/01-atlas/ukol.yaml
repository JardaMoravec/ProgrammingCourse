title: Atlas zvířat
stars: 3
moodle: PRG-3-08-01
typ: flask
soubor: atlas.py
description: |
  Napište Flask aplikaci v souboru `atlas.py` — krátký **atlas zvířat**.

  Dynamická routa (název funkce je na vás, cesta musí sedět):

  `/zvire/<slug>`

  Na hlavní stránce `/` vypište odkazy na **tyto tři** slugy: `panda`, `vlk`, `sova`.
  Odkazy složte přes `url_for`, ne natvrdo `/zvire/panda`.

  Na detailu vypište `slug` v `<h1>` **přesně** (malá písmena: `panda`, `vlk`, `sova`).
  Můžete přidat i vlastní větu v `<p>`.
  Menu / odkaz zpět na `/` také přes `url_for`.

  Použijte šablony (`render_template`). Dědičnost (`zaklad.html`) je vítaná, není povinná.
odevzdani: |
  Do Moodle nahrajte `atlas.py` a složku `templates/`. Spusťte **Evaluate**.
evaluate:
  - name: Routa a url_for
    templates: [index.html]
    source_contains: ["<slug>"]
    template_contains:
      index.html:
        - "url_for"
  - name: Hlavní stránka
    get: /
    status: 200
    href: [/zvire/panda, /zvire/vlk, /zvire/sova]
  - name: Panda
    get: /zvire/panda
    status: 200
    tags: [h1]
    contains: ["panda"]
  - name: Vlk
    get: /zvire/vlk
    status: 200
    tags: [h1]
    contains: ["vlk"]
  - name: Sova
    get: /zvire/sova
    status: 200
    tags: [h1]
    contains: ["sova"]
