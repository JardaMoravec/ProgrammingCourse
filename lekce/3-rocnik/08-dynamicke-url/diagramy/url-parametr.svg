<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-label="Flask vytahne z URL parametr a preda ho pohledu">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path class="d-accent" d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect class="d-bg" width="720" height="220" rx="10" fill="#f8f9fb" stroke="#e5e7eb"/>

  <rect class="d-surface" x="24" y="40" width="200" height="112" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text class="d-accent" x="124" y="78" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#2563eb">URL</text>
  <text class="d-muted" x="124" y="104" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#5c6370">/clanek/2</text>
  <text class="d-muted" x="124" y="126" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#5c6370">cesta + hodnota</text>

  <rect class="d-soft" x="260" y="40" width="200" height="112" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text class="d-accent" x="360" y="78" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#2563eb">Routa</text>
  <text class="d-muted" x="360" y="104" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#5c6370">/clanek/&lt;int:cislo&gt;</text>
  <text class="d-muted" x="360" y="126" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#5c6370">cislo = 2</text>

  <rect class="d-surface" x="496" y="40" width="200" height="112" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text class="d-accent" x="596" y="78" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#2563eb">Pohled</text>
  <text class="d-muted" x="596" y="104" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#5c6370">def clanek(cislo)</text>
  <text class="d-muted" x="596" y="126" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#5c6370">do &#353;ablony</text>

  <line class="d-stroke-accent" x1="224" y1="96" x2="256" y2="96" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
  <line class="d-stroke-accent" x1="460" y1="96" x2="492" y2="96" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>

  <text class="d-muted" x="360" y="188" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#5c6370">Jedna funkce obslou&#382;&#237; mnoho adres &#8212; m&#283;n&#237; se jen parametr</text>
