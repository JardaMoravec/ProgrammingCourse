<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Struktura tabulek se zaklada jednou pri startu, ne pri kazdem GET">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path class="d-accent" d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect class="d-bg" width="720" height="300" rx="10" fill="#f8f9fb" stroke="#e5e7eb"/>

  <rect class="d-soft" x="24" y="20" width="200" height="88" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text class="d-accent" x="124" y="52" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#2563eb">Start aplikace</text>
  <text class="d-muted" x="124" y="76" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#5c6370">app_context</text>

  <rect class="d-surface" x="260" y="20" width="200" height="88" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text class="d-accent" x="360" y="52" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#2563eb">init_db()</text>
  <text class="d-muted" x="360" y="76" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#5c6370">CREATE TABLE IF NOT EXISTS</text>

  <rect class="d-surface" x="496" y="20" width="200" height="88" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text class="d-accent" x="596" y="52" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#2563eb">skola.db</text>
  <text class="d-muted" x="596" y="76" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#5c6370">struktura jednou</text>

  <line class="d-stroke-accent" x1="224" y1="64" x2="256" y2="64" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
  <line class="d-stroke-accent" x1="460" y1="64" x2="492" y2="64" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>

  <rect class="d-surface" x="24" y="160" width="320" height="100" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text class="d-accent" x="184" y="196" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#2563eb">GET /</text>
  <text class="d-muted" x="184" y="220" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#5c6370">jen &#353;ablona</text>
  <text class="d-muted" x="184" y="242" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#5c6370">u&#382; bez CREATE</text>

  <rect class="d-soft" x="376" y="160" width="320" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text class="d-accent" x="536" y="196" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#2563eb">&#352;patn&#283;</text>
  <text class="d-muted" x="536" y="220" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#5c6370">init_db() v pohledu</text>
  <text class="d-muted" x="536" y="242" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#5c6370">ka&#382;d&#253; GET znovu</text>

  <path class="d-stroke-accent" d="M124,108 L124,156" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
  <text class="d-muted" x="360" y="288" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#5c6370">IF NOT EXISTS &#183; druh&#253; start tabulku nezakl&#225;d&#225; znovu jako chybu</text>
</svg>
