  <text class="d-text" x="360" y="125" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="600" fill="#1a1d26">/kontakt &#8594; kontakt</text>
  <text class="d-muted" x="360" y="168" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#5c6370">/info &#160;&#8594;&#160; info</text>
  <text class="d-muted" x="360" y="194" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#5c6370">jin&#225; cesta &#8594; 404</text>

