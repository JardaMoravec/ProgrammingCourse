  <line class="d-stroke-accent" x1="472" y1="120" x2="524" y2="120" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>

  <text class="d-muted" x="360" y="244" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#5c6370">Cesta v URL ur&#269;&#237;, kterou funkci Flask zavol&#225;</text>
