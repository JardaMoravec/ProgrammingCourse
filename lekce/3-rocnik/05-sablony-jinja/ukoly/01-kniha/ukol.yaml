title: Oblíbená kniha
stars: 2
moodle: PRG-3-05-01
typ: flask
soubor: kniha.py
description: |
  Napište Flask aplikaci v souboru `kniha.py` a šablonu `templates/index.html`.
  Na adrese `/` zobrazte stránku o **oblíbené knize** (název si vymyslete).

  Z Pythonu do šablony předejte aspoň **název**, **autora** a **rok**.
  V šabloně je vypište přes `{{ … }}` — nepište je natvrdo jen do HTML.

  Na stránce musí být:

  - `<h1>` s názvem knihy,
  - jeden `<p>` s autorem,
  - jeden `<p>` s rokem.

  Použijte `render_template`. Pořád jen cesta `/`.
odevzdani: |
  Do Moodle nahrajte `kniha.py` a `templates/index.html` (složka `templates/`
  musí zůstat). Spusťte **Evaluate**.
evaluate:
  - name: Šablona a render_template
    templates: [index.html]
    source_contains: [render_template]
    template_contains:
      index.html:
        - "{{"
  - name: Hlavní stránka
    get: /
    status: 200
    tags: [h1, p]
    min_tags:
      p: 2
    not_contains: ["{{"]
