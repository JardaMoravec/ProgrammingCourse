<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-label="Priklad HTTP pozadavku GET a odpovedi 200 OK">
  <defs>
    <marker id="arrow-http" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path class="d-accent" d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect class="d-bg" width="720" height="240" rx="10" fill="#f8f9fb" stroke="#e5e7eb"/>

  <rect class="d-surface" x="32" y="36" width="280" height="140" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text class="d-accent" x="172" y="62" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#2563eb">Po&#382;&#225;davek (klient)</text>
  <text class="d-text" x="52" y="92" font-family="Consolas, monospace" font-size="12" fill="#1a1d26">GET /rozvrh HTTP/1.1</text>
  <text class="d-text" x="52" y="114" font-family="Consolas, monospace" font-size="12" fill="#1a1d26">Host: www.skola.cz</text>
  <text class="d-text" x="52" y="136" font-family="Consolas, monospace" font-size="12" fill="#1a1d26">Accept: text/html</text>
  <text class="d-muted" x="52" y="158" font-family="Segoe UI, sans-serif" font-size="11" fill="#5c6370">t&#283;lo: pr&#225;zdn&#233;</text>

  <rect class="d-soft" x="408" y="36" width="280" height="140" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text class="d-accent" x="548" y="62" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#2563eb">Odpov&#283;&#271; (server)</text>
  <text class="d-text" x="428" y="92" font-family="Consolas, monospace" font-size="12" fill="#1a1d26">HTTP/1.1 200 OK</text>
  <text class="d-text" x="428" y="114" font-family="Consolas, monospace" font-size="12" fill="#1a1d26">Content-Type: text/html</text>
  <text class="d-text" x="428" y="136" font-family="Consolas, monospace" font-size="12" fill="#1a1d26">&lt;html&gt; ... rozvrh ... &lt;/html&gt;</text>
  <text class="d-muted" x="428" y="158" font-family="Segoe UI, sans-serif" font-size="11" fill="#5c6370">t&#283;lo: HTML str&#225;nky</text>

  <line class="d-stroke-accent" x1="320" y1="106" x2="400" y2="106" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-http)"/>

  <text class="d-muted" x="360" y="208" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#5c6370">GET jen &#269;te &#183; POST (formul&#225;&#345;) pos&#237;l&#225; data v t&#283;le po&#382;&#225;davku</text>
</svg>
