<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Nahrání souboru</title>
</head>
<body>
  <h1>Nahrání souboru</h1>
  {% for zprava in get_flashed_messages() %}
    <p>{{ zprava }}</p>
  {% endfor %}
  {% if chyba %}
    <p>{{ chyba }}</p>
  {% endif %}
  <form action="{{ url_for('index') }}" method="post" enctype="multipart/form-data">
    <label>Soubor <input type="file" name="soubor"></label>
    <button type="submit">Nahrát</button>
  </form>
  {% for jmeno in obrazky %}
    <p>
      <img src="{{ url_for('static', filename='uploads/' + jmeno) }}" alt="{{ jmeno }}">
    </p>
  {% endfor %}
</body>
</html>
