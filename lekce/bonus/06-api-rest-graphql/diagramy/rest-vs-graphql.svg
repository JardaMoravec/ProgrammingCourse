<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-label="REST vice URL proti GraphQL jednomu dotazu">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path class="d-accent" d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect class="d-bg" width="720" height="240" rx="10" fill="#f8f9fb" stroke="#e5e7eb"/>
  <text class="d-accent" x="180" y="32" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#2563eb">REST</text>
  <rect class="d-surface" x="28" y="48" width="304" height="44" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text class="d-text" x="180" y="76" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1a1d26">GET /knihy/1</text>
  <rect class="d-surface" x="28" y="108" width="304" height="44" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text class="d-text" x="180" y="136" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1a1d26">GET /autori/5</text>
  <text class="d-muted" x="180" y="176" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#5c6370">dva pozadavky, cele objekty</text>
  <line class="d-stroke-accent" x1="360" y1="40" x2="360" y2="200" stroke="#e5e7eb" stroke-width="2"/>
  <text class="d-accent" x="540" y="32" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#2563eb">GraphQL</text>
  <rect class="d-soft" x="388" y="48" width="304" height="104" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text class="d-text" x="540" y="80" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#1a1d26">POST /graphql</text>
  <text class="d-text" x="540" y="104" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#1a1d26">kniha { nazev</text>
  <text class="d-text" x="540" y="124" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#1a1d26">autor { jmeno } }</text>
  <text class="d-muted" x="540" y="176" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#5c6370">jeden pozadavek, vybrana pole</text>
  <text class="d-muted" x="360" y="218" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#5c6370">Stejna kniha a autor - jina dohoda</text>
</svg>
