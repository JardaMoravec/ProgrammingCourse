  <text class="d-muted" x="360" y="112" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#5c6370">jm&#233;no + postup</text>
  <text class="d-muted" x="360" y="136" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#5c6370">iter&#225;tor, strategie&#8230;</text>

