  <text class="d-text" x="612" y="100" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1a1d26">t&#345;&#237;dy</text>
  <text class="d-muted" x="612" y="126" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#5c6370">stejn&#253; n&#225;pad, jin&#233; t&#233;ma</text>

  <text class="d-muted" x="360" y="210" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#5c6370">nen&#237; to knihovna ani nov&#225; syntaxe &#8212; je to pojmenovan&#253; n&#225;vrh</text>
