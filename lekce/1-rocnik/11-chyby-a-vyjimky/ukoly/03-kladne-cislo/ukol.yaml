title: Kladné celé číslo
stars: 2
description: |
  Napište program, který načte **jeden** vstup a ověří, zda je to **kladné celé
  číslo**. Cyklus `while` nepoužívejte.

  Při chybě (text, nula, záporné číslo): `Neplatný vstup.`

  Po úspěchu: `Děkuji, zadali jste: X`
cases:
- name: ok
  input: |
    5
  output: 'Děkuji, zadali jste: 5'
- name: nula
  input: |
    0
  output: Neplatný vstup.
- name: zaporne
  input: |
    -3
  output: Neplatný vstup.
- name: text
  input: |
    abc
  output: Neplatný vstup.
io: |
  **Vstup:** jeden pokus
  **Výstup:** potvrzení, nebo chybová hláška
