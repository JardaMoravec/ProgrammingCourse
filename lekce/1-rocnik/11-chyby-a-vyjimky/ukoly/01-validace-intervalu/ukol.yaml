title: Validace celého čísla
stars: 2
description: |
  Napište program, který načte **jeden** vstup a ověří, zda je to **celé číslo
  v rozsahu −100 až 100**. Cyklus `while` nepoužívejte.

  Při chybě (text, desetinné číslo, hodnota mimo rozsah) vypište:
  `Chyba: zadejte celé číslo v rozsahu -100 až 100.`

  Po úspěchu vypište: `Číslo je X.` (kde X je zadané číslo) a program skončí.
cases:
- name: ok
  input: |
    50
  output: Číslo je 50.
- name: dolni-mez
  input: |
    -100
  output: Číslo je -100.
- name: horni-mez
  input: |
    100
  output: Číslo je 100.
- name: mimo
  input: |
    200
  output: 'Chyba: zadejte celé číslo v rozsahu -100 až 100.'
- name: text
  input: |
    abc
  output: 'Chyba: zadejte celé číslo v rozsahu -100 až 100.'
io: |
  **Vstup:** jeden pokus
  **Výstup:** potvrzení, nebo chybová hláška
moodle: PRG-1-11-01
