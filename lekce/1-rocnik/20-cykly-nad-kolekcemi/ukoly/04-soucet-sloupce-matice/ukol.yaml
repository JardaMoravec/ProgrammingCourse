title: Součet sloupce matice
stars: 3
description: |
  Napište program s pevnou maticí 3×3 `[[1,2,3],[4,5,6],[7,8,9]]` a vypište součty sloupců jako seznam.

  Program **nenačítá vstup**.
cases:
- name: 3x3
  input: |2+

  output: '[12, 15, 18]'
io: |
  **Vstup:** žádný
  **Výstup:** součty sloupců
