title: Průměr sudých
stars: 2
description: Napište program, který načte N a N celých čísel. Vypočítejte průměr sudých čísel v seznamu. Pokud sudé není, vypište `Žádná sudá čísla.`
cases:
- name: 2-4-6
  input: '3


    2


    4


    6


    '
  output: 'Průměr sudých: 4.0'
  numeric: true
- name: jen licha
  input: '2


    1


    3


    '
  output: Žádná sudá čísla.
io: '**Vstup:** N, N čísel

  **Výstup:** průměr sudých'
