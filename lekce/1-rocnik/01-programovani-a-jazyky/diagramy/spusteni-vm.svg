  <text x="426" y="94" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#5c6370">.class / .pyc</text>

  <rect x="528" y="44" width="168" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
