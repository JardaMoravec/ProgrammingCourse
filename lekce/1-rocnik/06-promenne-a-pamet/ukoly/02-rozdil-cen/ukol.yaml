title: Rozdíl cen
stars: 1
description: |
  Napište program, který načte nákupní a prodejní cenu (celá čísla, Kč) a vypíše rozdíl ve tvaru:

  `Rozdíl: X Kč`

  (Rozdíl = prodejní − nákupní, může být i záporný.)
cases:
- name: zisk
  input: |
    50
    100
  output: 'Rozdíl: 50 Kč'
- name: ztrata
  input: |
    120
    80
  output: 'Rozdíl: -40 Kč'
- name: nula
  input: |
    100
    100
  output: 'Rozdíl: 0 Kč'
io: |
  **Vstup:** nákupní cena, prodejní cena
  **Výstup:** `Rozdíl: X Kč`
