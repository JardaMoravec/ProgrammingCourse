title: Cena celkem
stars: 1
description: Napište program, který načte cenu za kus a počet kusů (desetinná čísla) a vypíše celkovou cenu.
cases:
- name: 150x3
  input: '150


    3


    '
  output: 'Celkem: 450.0 Kč'
  numeric: true
