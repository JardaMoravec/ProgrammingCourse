title: Průměr dvou čísel
stars: 2
description: Napište program, který načte dvě desetinná čísla a vypíše jejich aritmetický průměr na jeden desetinný místo.
cases:
- name: 2 a 4
  input: '2

    4

    '
  output: 'Průměr: 3.0'
  numeric: true
- name: 1.5 a 2.5
  input: '1.5

    2.5

    '
  output: 'Průměr: 2.0'
  numeric: true
- name: 10 a 20
  input: '10

    20

    '
  output: 'Průměr: 15.0'
  numeric: true
io: '**Vstup:** dvě desetinná čísla

  **Výstup:** `Průměr: X.X`

  '
