title: Součet zadaných čísel
stars: 2
description: Napište program, který opakovaně načítá celá čísla. Na vstupu `0` skončí a vypíše součet všech předchozích čísel.
cases:
- name: 1+2+3
  input: '1

    2

    3

    0

    '
  output: 'Součet: 6'
- name: jen 0
  input: '0

    '
  output: 'Součet: 0'
io: '**Vstup:** čísla ukončená 0

  **Výstup:** součet

  '
