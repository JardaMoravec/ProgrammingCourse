title: Kvadrátová rovnice — diskriminant
stars: 3
description: Napište program, který načte koeficienty a, b, c (celá čísla) kvadrátové rovnice ax²+bx+c=0 a vypíše diskriminant D = b² − 4ac.
cases:
- name: x2-5x+6
  input: '1

    -5

    6

    '
  output: D = 1
- name: x2+1
  input: '1

    0

    1

    '
  output: D = -4
- name: 2x2+4x+2
  input: '2

    4

    2

    '
  output: D = 0
io: '**Vstup:** a, b, c

  **Výstup:** diskriminant

  '
