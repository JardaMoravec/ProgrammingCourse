<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="Lokalni repozitar na pocitaci a vzdalena kopie na GitHubu">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path class="d-accent" d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect class="d-bg" width="720" height="200" rx="10" fill="#f8f9fb" stroke="#e5e7eb"/>

  <rect class="d-surface" x="36" y="40" width="260" height="110" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text class="d-text" x="166" y="84" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1a1d26">Váš počítač</text>
  <text class="d-muted" x="166" y="110" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#5c6370">lokální Git · IDE</text>

  <rect class="d-soft" x="424" y="40" width="260" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text class="d-accent" x="554" y="84" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#2563eb">GitHub</text>
  <text class="d-muted" x="554" y="110" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#5c6370">vzdálená kopie · prohlížeč</text>

  <line class="d-stroke-accent" x1="296" y1="78" x2="424" y2="78" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
  <line class="d-stroke-accent" x1="424" y1="112" x2="296" y2="112" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
  <text class="d-muted" x="360" y="70" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#5c6370">Push</text>
  <text class="d-muted" x="360" y="136" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#5c6370">Pull / Clone</text>

  <text class="d-muted" x="360" y="178" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#5c6370">Git ukládá historii · GitHub ji hostuje na webu</text>
</svg>
