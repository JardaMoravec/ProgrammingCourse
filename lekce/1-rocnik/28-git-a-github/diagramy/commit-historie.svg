<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="Pracovni soubory, commit a historie snimku">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path class="d-accent" d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect class="d-bg" width="720" height="200" rx="10" fill="#f8f9fb" stroke="#e5e7eb"/>

  <rect class="d-surface" x="20" y="48" width="150" height="88" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text class="d-text" x="95" y="86" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#1a1d26">Pracovní kopie</text>
  <text class="d-muted" x="95" y="108" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#5c6370">soubory v IDE</text>

  <rect class="d-soft" x="210" y="60" width="120" height="64" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text class="d-accent" x="270" y="98" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#2563eb">Commit</text>

  <rect class="d-surface" x="370" y="36" width="330" height="112" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text class="d-text" x="535" y="60" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#1a1d26">Historie</text>

  <rect class="d-soft" x="390" y="76" width="86" height="52" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text class="d-accent" x="433" y="98" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#2563eb">c1</text>
  <text class="d-muted" x="433" y="116" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#5c6370">start</text>

  <rect class="d-soft" x="492" y="76" width="86" height="52" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text class="d-accent" x="535" y="98" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#2563eb">c2</text>
  <text class="d-muted" x="535" y="116" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#5c6370">oprava</text>

  <rect class="d-soft" x="594" y="76" width="86" height="52" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text class="d-accent" x="637" y="98" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#2563eb">c3</text>
  <text class="d-muted" x="637" y="116" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#5c6370">teď</text>

  <line class="d-stroke-accent" x1="170" y1="92" x2="208" y2="92" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
  <line class="d-stroke-accent" x1="330" y1="92" x2="368" y2="92" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>

  <text class="d-muted" x="360" y="178" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#5c6370">Ctrl+S uloží soubor · commit uloží snímek do historie</text>
</svg>
