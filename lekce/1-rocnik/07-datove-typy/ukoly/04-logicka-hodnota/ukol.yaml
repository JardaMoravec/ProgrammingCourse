title: Porovnání dvou čísel
stars: 2
description: |
  Napište program, který načte dvě celá čísla a vypíše `True` nebo `False` podle toho, zda je první větší než druhé.
cases:
- name: 5>3
  input: |
    5
    3
  output: 'True'
- name: 2>8
  input: |
    2
    8
  output: 'False'
- name: 4>4
  input: |
    4
    4
  output: 'False'
io: |
  **Vstup:** dvě celá čísla
  **Výstup:** `True` nebo `False`
