title: Plnoletost
stars: 1
description: |
  Napište program, který načte věk (celé číslo) a vypíše `Ano` nebo `Ne` podle toho, zda je osoba plnoletá (věk ≥ 18).
cases:
- name: '17'
  input: |
    17
  output: Ne
- name: '18'
  input: |
    18
  output: Ano
- name: '25'
  input: |
    25
  output: Ano
io: |
  **Vstup:** věk
  **Výstup:** `Ano` nebo `Ne`
