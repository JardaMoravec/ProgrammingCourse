cases:
- name: '16'
  input: '16

    '
  output: Za 5 let vám bude 21.
- name: '0'
  input: '0

    '
  output: Za 5 let vám bude 5.
- name: '40'
  input: '40

    '
  output: Za 5 let vám bude 45.
io: |
