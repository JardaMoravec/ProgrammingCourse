title: Dvojciferné číslo
stars: 1
moodle: PRG-1-08-03
description: |
  Napište program, který načte celé číslo a vypíše `True` nebo `False` podle toho,
  zda je **dvojciferné** (od 10 do 99 včetně).
io: |
  **Vstup:** celé číslo
  **Výstup:** `True` nebo `False`
cases:
  - name: "42"
    input: |
      42
    output: "True"
  - name: "9"
    input: |
      9
    output: "False"
  - name: "100"
    input: |
      100
    output: "False"
  - name: "10"
    input: |
      10
    output: "True"
