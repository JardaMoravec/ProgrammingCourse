title: Alespoň jedno záporné
stars: 2
moodle: PRG-1-08-04
description: |
  Napište program, který načte dvě celá čísla `a` a `b` a vypíše `True` nebo `False`,
  pokud je **alespoň jedno** z nich záporné.

  Použijte operátor `or`.
io: |
  **Vstup:** celá čísla a, b
  **Výstup:** `True` nebo `False`
cases:
  - name: -1 a 5
    input: |
      -1
      5
    output: "True"
  - name: 3 a 5
    input: |
      3
      5
    output: "False"
  - name: -2 a -3
    input: |
      -2
      -3
    output: "True"
  - name: 0 a 5
    input: |
      0
      5
    output: "False"
