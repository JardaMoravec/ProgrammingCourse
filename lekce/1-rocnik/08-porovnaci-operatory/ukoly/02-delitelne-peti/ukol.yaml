title: Dělitelnost třemi
stars: 2
moodle: PRG-1-08-02
description: |
  Napište program, který načte celé číslo a vypíše `True` nebo `False` podle toho,
  zda je **dělitelné třemi** (beze zbytku).
io: |
  **Vstup:** celé číslo
  **Výstup:** `True` nebo `False`
cases:
  - name: "9"
    input: |
      9
    output: "True"
  - name: "10"
    input: |
      10
    output: "False"
  - name: "0"
    input: |
      0
    output: "True"
