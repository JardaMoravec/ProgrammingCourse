title: Plné krabice a zbytek
stars: 2
moodle: PRG-1-05-02
description: |
  Napište program s proměnnými `polozky = 23` a `kapacita = 4`.
  Vypočítejte počet plných krabic (`//`) a zbytek (`%`). Vypište dva řádky:

  ```
  Krabic: 5
  Zbytek: 3
  ```

io: |
  **Vstup:** žádný
  **Výstup:** počet krabic a zbytek (dva řádky)
cases:
  - name: 23/4
    output: |
      Krabic: 5
      Zbytek: 3
