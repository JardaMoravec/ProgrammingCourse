title: Výpočet výrazu
stars: 2
description: |
  Napište program, který načte celé číslo `x` a vypíše hodnotu výrazu:

  `2 * x + 5`

  Formát výstupu: `Výsledek: ...`
cases:
- name: x=3
  input: |
    3
  output: 'Výsledek: 11'
- name: x=0
  input: |
    0
  output: 'Výsledek: 5'
- name: x=10
  input: |
    10
  output: 'Výsledek: 25'
io: |
  **Vstup:** celé číslo x
  **Výstup:** `Výsledek: ...`
