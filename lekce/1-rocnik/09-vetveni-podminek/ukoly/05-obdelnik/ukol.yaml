title: Dostatek peněz
stars: 2
moodle: PRG-1-09-05
description: |
  Napište program, který načte **cenu zboží** a **kolik máte v peněžence** (Kč).
  Vypište `Koupíte`, pokud máte dost peněz, jinak `Nemáte dost`.
io: |
  **Vstup:** cena, peníze v peněžence
  **Výstup:** `Koupíte` nebo `Nemáte dost`
cases:
  - name: staci
    input: |
      100
      150
    output: "Koupíte"
  - name: nestaci
    input: |
      100
      50
    output: "Nemáte dost"
  - name: presne
    input: |
      200
      200
    output: "Koupíte"
