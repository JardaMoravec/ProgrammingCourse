title: Obsah a obvod obdélníku
stars: 2
description: |
  Napište program, který načte strany obdélníku `a` a `b`. Pokud je některá záporná, vypište:

  `Chyba: strany nemohou být záporné.`

  Jinak vypište obsah a obvod:

  ```
  Obsah: ...
  Obvod: ...
  ```
cases:
- name: 4x5
  input: |
    4
    5
  output: 'Obsah: 20.0

    Obvod: 18.0'
  numeric: true
- name: zaporna
  input: |
    4
    -2
  output: 'Chyba: strany nemohou být záporné.'
io: |
  **Vstup:** strany a, b
  **Výstup:** chyba nebo obsah a obvod
moodle: PRG-1-09-05
