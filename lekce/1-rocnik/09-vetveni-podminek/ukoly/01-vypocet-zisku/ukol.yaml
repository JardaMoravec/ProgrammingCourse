title: Levnější obchod
stars: 2
moodle: PRG-1-09-01
description: |
  Napište program, který načte cenu stejného zboží v **obchodě A** a **obchodě B** (Kč)
  a vypíše, kde je výhodněji:

  - levnější je A → `Obchod A`
  - levnější je B → `Obchod B`
  - stejná cena → `Stejná cena`
io: |
  **Vstup:** cena v A, cena v B
  **Výstup:** jeden řádek
cases:
  - name: B levnejsi
    input: |
      100
      80
    output: "Obchod B"
  - name: stejna cena
    input: |
      50
      50
    output: "Stejná cena"
  - name: A levnejsi
    input: |
      30
      40
    output: "Obchod A"
