title: Prospěl na testu
stars: 2
moodle: PRG-1-09-02
description: |
  Napište program, který načte body z testu (0–100). Pokud je hodnota **mimo rozsah**,
  vypište `Chyba: body mimo rozsah.` Jinak vypište `Prospěl` (50 bodů a více)
  nebo `Neprospěl` (méně než 50).
io: |
  **Vstup:** body (celé číslo)
  **Výstup:** chyba, nebo Prospěl / Neprospěl
cases:
  - name: prospech
    input: |
      75
    output: "Prospěl"
  - name: neprospech
    input: |
      49
    output: "Neprospěl"
  - name: mimo rozsah
    input: |
      101
    output: "Chyba: body mimo rozsah."
