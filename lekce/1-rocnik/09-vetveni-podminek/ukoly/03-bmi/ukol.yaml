title: Teplotní režim
stars: 3
moodle: PRG-1-09-03
description: |
  Napište program, který načte teplotu venku (°C, desetinné číslo) a vypíše jednu z kategorií:

  | Teplota | Výstup |
  |---------|--------|
  | < 0 | `Ledová` |
  | < 15 | `Chladno` |
  | < 25 | `Příjemně` |
  | jinak | `Horko` |
io: |
  **Vstup:** teplota v °C
  **Výstup:** jedno slovo (kategorie)
cases:
  - name: ledova
    input: |
      -5
    output: "Ledová"
  - name: chladno
    input: |
      10
    output: "Chladno"
  - name: prijemne
    input: |
      20
    output: "Příjemně"
  - name: horko
    input: |
      30
    output: "Horko"
