title: Neplatný odkaz
stars: 3
moodle: PRG-2-12-03
typ: soubor
description: |
  Dvě tabulky. Třetí výpůjčka odkazuje na čtenáře, který v tabulce **není**.

  **ctenari**

  | id | jmeno |
  |----|-------|
  | 10 | Novak |
  | 20 | Svoboda |

  **vypujcky**

  | id | kniha | ctenar_id |
  |----|-------|-----------|
  | 1 | Babicka | 10 |
  | 2 | Krakatit | 20 |
  | 3 | R.U.R. | 99 |

  V dokumentu odpovězte:

  1. Jak se jmenuje cizí klíč a kam odkazuje.
  2. Který řádek je neplatný odkaz a proč.
  3. Co s tím řádkem udělá databáze, která cizí klíč hlídá.
  4. U platných výpůjček doplňte tabulku `id`, `kniha`, `jmeno` čtenáře
     (jméno vezměte z `ctenari`, nepište ho znovu do `vypujcky`).
odevzdani: |
  Do AMOS nahrajte dokument (TXT, PDF nebo DOCX) s odpověďmi 1–3
  a tabulkou z bodu 4. Automatický test není — hodnotí učitel.
