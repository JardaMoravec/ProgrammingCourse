title: Vložení do seřazeného
stars: 2
moodle: PRG-2-02-04
description: |
  Načtěte jeden řádek **už vzestupně seřazených** celých čísel. Na druhém
  řádku načtěte **alespoň tři** celá čísla — každé z nich do seznamu
  **zařaďte** na správné místo.

  Čísla ze druhého řádku vkládejte **v pořadí ze vstupu**, každé zvlášť.
  Najděte místo (zleva, nebo půlením) a vložte. **Nesmíte** znovu řadit
  celý seznam (`sort()`, `sorted()`, bublinkové řazení celého seznamu
  po vkladu a podobně).

  Vypište výsledný seznam na jeden řádek, čísla oddělená mezerou.

  Příklad: `1 4 9 16 25` a vklady `10 0 30` →

  `0 1 4 9 10 16 25 30`

  Pro automatický test použijte `input()` **bez textu**.
cases:
  - name: zaklad
    input: |
      1 4 9 16 25
      10 0 30
    output: "0 1 4 9 10 16 25 30"
  - name: doprostred
    input: |
      10 20 30 40
      15 25 35
    output: "10 15 20 25 30 35 40"
  - name: duplicity
    input: |
      1 3 3 5
      3 0 5
    output: "0 1 3 3 3 5 5"
  - name: zaporna
    input: |
      -5 0 8
      -10 3 -5
    output: "-10 -5 -5 0 3 8"
  - name: ctyri-vklady
    input: |
      2 4 6
      1 3 5 7
    output: "1 2 3 4 5 6 7"
  - name: na-konec
    input: |
      1 2 3
      8 9 10
    output: "1 2 3 8 9 10"
io: |
  **Vstup:** seřazená čísla, pak řádek s alespoň třemi vklady
  **Výstup:** výsledný seznam na jednom řádku
