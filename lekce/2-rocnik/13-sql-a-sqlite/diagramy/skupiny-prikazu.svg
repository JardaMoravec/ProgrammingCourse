  <text class="d-muted" x="360" y="262" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#5c6370">DELETE ma&#382;e &#345;&#225;dky (DML), DROP ma&#382;e tabulku (DDL)</text>
