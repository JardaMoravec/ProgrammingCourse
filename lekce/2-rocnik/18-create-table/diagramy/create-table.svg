<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="CREATE TABLE produkty se sloupci id, nazev a cena">
  <rect class="d-bg" width="720" height="280" rx="10" fill="#f8f9fb" stroke="#e5e7eb"/>
  <text class="d-text" x="360" y="36" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#1a1d26">CREATE TABLE produkty</text>

