  <text class="d-accent" x="360" y="92" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#2563eb">id INTEGER PRIMARY KEY</text>

  <rect class="d-surface" x="48" y="116" width="624" height="44" rx="6" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
