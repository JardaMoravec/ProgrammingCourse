  <text class="d-muted" x="360" y="196" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#5c6370">cena REAL</text>

  <text class="d-muted" x="360" y="248" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#5c6370">jeden p&#345;&#237;kaz zalo&#382;&#237; tabulku, sloupce i prim&#225;rn&#237; kl&#237;&#269;</text>
